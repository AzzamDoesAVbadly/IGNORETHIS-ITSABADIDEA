# The live site is machine-made-god/. Keep in sync with machine-made-god/netlify.toml
# (Netlify uses that one instead if the dashboard "Base directory" is set to machine-made-god).
[build]
  base = "machine-made-god"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
