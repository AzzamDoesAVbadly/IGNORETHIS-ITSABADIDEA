# The live site is my-project/. Keep this in sync with my-project/netlify.toml
# (Netlify uses that one instead if the dashboard "Base directory" is set to my-project).
[build]
  base = "my-project"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
