<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalCorp Dashboard</title>
    <style>
      :root {
        --bg: #071119;
        --panel: rgba(17, 28, 39, 0.92);
        --text: #edf7ff;
        --muted: #a7bed3;
        --cyan: #75ebff;
        --pink: #ff7bcc;
        --line: rgba(255,255,255,0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #071119;
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .wrap {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 60px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0,1fr));
        gap: 16px;
      }
      .card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
      }
      .label {
        color: var(--cyan);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
      .big {
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: -0.08em;
        margin-top: 12px;
      }
      pre {
        margin-top: 18px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>SignalCorp Dashboard</h1>
      <div id="dashboard"></div>
    </div>

    <script>
      async function render() {
        const data = await fetch('/api/dashboard').then(r => r.json());
        document.getElementById('dashboard').innerHTML = `
          <div class="grid">
            <div class="card">
              <div class="label">Leads</div>
              <div class="big">${data.total_leads}</div>
            </div>
            <div class="card">
              <div class="label">Top topic</div>
              <div class="big">${data.topic_summary[0]?.topic || 'n/a'}</div>
            </div>
            <div class="card">
              <div class="label">Gate</div>
              <div class="big">${data.gate.status}</div>
            </div>
            <div class="card">
              <div class="label">Stories</div>
              <div class="big">${data.total_articles}</div>
            </div>
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      }
      render();
    </script>
  </body>
</html>
