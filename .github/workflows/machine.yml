# THE MACHINE: writes new content on a schedule and publishes it.
# Pushing to main triggers a Netlify deploy automatically.
name: The Machine

on:
  schedule:
    - cron: "17 13 * * *" # ~9am US Eastern
    - cron: "47 1 * * *" # ~9pm US Eastern
  workflow_dispatch: # "Run workflow" button in the Actions tab, or the control panel
    inputs:
      idea:
        description: "Optional: an idea for one on-demand article"
        required: false
        type: string
      category:
        description: "Optional: section slug (news, lists, music, ...)"
        required: false
        type: string
      format:
        description: "Optional: news, listicle, review, announcement or essay"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: the-machine
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: machine-made-god
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machine-made-god/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Generate content (provider roulette)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MACHINE_ENABLED: ${{ vars.MACHINE_ENABLED }}
          SITE_URL: ${{ vars.SITE_URL }}
          MACHINE_IDEA: ${{ inputs.idea }}
          MACHINE_CATEGORY: ${{ inputs.category }}
          MACHINE_FORMAT: ${{ inputs.format }}
        run: npm run generate

      - name: Build and validate (nothing is published if this fails)
        run: npm run build

      - name: Publish
        run: |
          git config user.name "machine-made-god[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content src/data
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "The machine has spoken ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Promote new posts (best effort, waits for the deploy)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          PROMOTION_ENABLED: ${{ vars.PROMOTION_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: node scripts/promote.mjs --new --wait

      - name: Save promotion log (does not trigger a site rebuild)
        run: |
          git add src/data/promo-log.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promotion log [skip netlify]"
          git pull --rebase origin main
          git push origin HEAD:main
