# MMG podcast: one fake two-host talk show episode a week from a politics/business article.
name: Podcast

on:
  schedule:
    - cron: "0 15 * * 3" # Wednesdays ~11am US Eastern
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional: make the episode from this article slug"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: the-machine
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: machine-made-god
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machine-made-god/package-lock.json
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci
      - name: Build site (for article art)
        run: npx astro build
      - name: Write, voice and upload
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MACHINE_ENABLED: ${{ vars.MACHINE_ENABLED }}
          PODCAST_ENABLED: ${{ vars.PODCAST_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then node scripts/podcast.mjs --slug "$SLUG"; else node scripts/podcast.mjs; fi
      - name: Keep the episode as a download (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: podcast-${{ github.run_id }}
          path: machine-made-god/podcast-out/episode-*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: Save podcast log
        run: |
          git config user.name "machine-made-god[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/podcast-log.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Podcast log [skip ci] [skip netlify]"
          git pull --rebase origin main
          git push origin HEAD:main
