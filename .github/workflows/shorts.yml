# MMG TV → YouTube Shorts. Renders a bump short and a headline short every day,
# uploads them to YouTube when it's connected, and keeps the MP4s as downloads.
name: Shorts

on:
  schedule:
    - cron: "30 16 * * *" # ~12:30pm US Eastern
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional: make a headline short for this article slug"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: the-machine
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: machine-made-god
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machine-made-god/package-lock.json
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci
      - name: Build site (for article art)
        run: npx astro build
      - name: Render and upload
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MACHINE_ENABLED: ${{ vars.MACHINE_ENABLED }}
          SHORTS_ENABLED: ${{ vars.SHORTS_ENABLED }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then node scripts/shorts.mjs --slug "$SLUG"; else node scripts/shorts.mjs; fi
      - name: Keep the videos as downloads (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: machine-made-god/shorts-out/*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: Save shorts log
        run: |
          git config user.name "machine-made-god[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/shorts-log.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Shorts log [skip netlify]"
          git pull --rebase origin main
          git push origin HEAD:main
