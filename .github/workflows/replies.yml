# Reply bot: answers Bluesky/Mastodon mentions in character every 30 minutes.
name: Replies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: machine-made-god
    steps:
      - name: Skip quickly if no social account is connected
        id: gate
        working-directory: .
        env:
          HAS_BSKY: ${{ secrets.BLUESKY_APP_PASSWORD != '' }}
          HAS_MASTO: ${{ secrets.MASTODON_TOKEN != '' }}
        run: |
          if [ "$HAS_BSKY" = "true" ] || [ "$HAS_MASTO" = "true" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "No social accounts connected yet."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machine-made-god/package-lock.json
      - name: Install ffmpeg (reaction GIFs)
        if: steps.gate.outputs.go
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm ci
        if: steps.gate.outputs.go
      - name: Reply
        if: steps.gate.outputs.go
        env:
          MACHINE_ENABLED: ${{ vars.MACHINE_ENABLED }}
          REPLIES_ENABLED: ${{ vars.REPLIES_ENABLED }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: node scripts/replies.mjs
      - name: Save reply log
        if: steps.gate.outputs.go
        run: |
          git config user.name "machine-made-god[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/replies-log.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reply log [skip ci] [skip netlify]"
          git pull --rebase origin main
          git push origin HEAD:main
